name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'PySide6>=6.7,<7'
      - name: Regression tests (no device or API key)
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Export tracked source (never runtime data or credentials)
        if: always()
        run: git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: test-results.txt
          retention-days: 7
